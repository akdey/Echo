name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: "a-k-dey/Echo"
        run: |
          # Create a clean deployment package with only backend, Dockerfile, and README
          mkdir -p hf_deploy
          cp -r backend hf_deploy/
          cp Dockerfile hf_deploy/
          cp README.md hf_deploy/
          
          # Initialize fresh git repository and push
          cd hf_deploy
          git init -b main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote add hf "https://a-k-dey:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git add .
          git commit -m "Deploy production backend to Hugging Face Spaces"
          git push -f hf main


